openclash:
  api: http://127.0.0.1:9090
  # secret 建议用环境变量 OPENCLASH_SECRET 注入；此处为兜底值
  secret: np7fj4lv
  provider: glados
targets:
- name: Gemini
  group: ♊ Gemini
  candidate_groups:
  - 🇯🇵 日本节点
  - 🇸🇬 新加坡节点
  - 🇺🇲 Gemini节点
  service_desc: 'Gemini 是 Google 旗下的 AI 服务（含 API 与网页版）， 对出口 IP 的机房属性与地区归属敏感。 官方支持地区包含日本、美国、新加坡等，未支持地区会被拒绝访问。

    '
  known_facts:
  - Gemini API 端点 generativelanguage.googleapis.com，未授权请求返回 401/403
  - 被 IP 风控时返回 403 或 429，而非鉴权错误
  - gstatic.com 的 generate_204 是通用连通性探测点，测不出平台级风控
  probe:
    url: https://generativelanguage.googleapis.com/v1beta/models
    ok_status:
    - 200
    - 400
    - 401
    - 403
    - 429
    blocked_status:
    - 403
    timeout: 8
    attempts: 2
engine:
  latency_weight: 0.4
  probe_weight: 0.45
  prior_weight: 0.15
  cooldown_sec: 90
  hysteresis: 0.15
  fail_threshold: 3
  blacklist_sec: 1800
  interval_sec: 120
  probe_cache_sec: 1800   # 探活结果缓存（进入候选打分）
  ip_echo_url: https://api.ipify.org   # 探活出口 IP 回显（审计"测的是谁"），置空关闭
  # 判据校准守卫：窗口内多个不同节点被"实锤"-> 判据可疑，暂缓拉黑
  criterion_window: 600
  criterion_max_distinct: 3
  # 巡游探检：主动逐个验证候选节点是否被平台风控
  patrol:
    enabled: false
    mode: roam              # roam=借生产组短暂切换验证（有打扰）; shadow=旁路监听（零打扰）
    top_k: 3                # 每轮体检的候选数（优先未实测、延迟低的）
    interval_sec: 1800      # 体检间隔（每个 target 独立节流）
    shadow_url: ""          # 例: http://127.0.0.1:17890（Mihomo http listener）
    shadow_group: ""        # 例: ♟️ 探活组（成员需包含 DIRECT 以做对照组）
jev:
  enabled: true
  api: https://api.typesafe.ai/v1/systemone
  model: jev-latest
  timeout: 45
  cache_sec: 3600
  apply_to_decision: true
server:
  host: 0.0.0.0
  port: 8000
  dry_run: false
  # 面板访问令牌：留空 = 不鉴权；设置后浏览器 Basic 认证（用户名任意，密码 = token）
  # 也可用环境变量 SMARTROUTE_TOKEN 注入
  token: ""
